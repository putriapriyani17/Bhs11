<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Try Out TKA</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ff;--card:#fff;--ink:#1c1f3a;--mute:#6a6f94;--pri:#4f46e5;--pri2:#7c3aed;--line:#dfe3fb;--ok:#16a34a;--doubt:#f59e0b;--none:#e5e7f5;--bad:#e11d48;--okbg:#e8f8ee;--badbg:#ffe9ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14152b;--card:#1e2040;--ink:#eceeff;--mute:#a0a5d0;--line:#32356a;--none:#33366b;--okbg:#10301f;--badbg:#3a1522;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14152b;--card:#1e2040;--ink:#eceeff;--mute:#a0a5d0;--line:#32356a;--none:#33366b;--okbg:#10301f;--badbg:#3a1522;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:20px;padding:28px 24px;margin-bottom:16px}
.hero h1{margin:0 0 4px;font-size:clamp(1.5rem,5vw,2.2rem);font-weight:800}
.hero p{margin:0;opacity:.9}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
input:focus,button:focus-visible{outline:3px solid var(--pri2);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer;color:#fff;background:var(--pri)}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.doubt{background:var(--doubt);color:#2b1d00}
.btn.doubt.on{background:#b45309;color:#fff}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.full{width:100%;margin-top:18px}
.hidden{display:none!important}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.who{font-size:.85rem;color:var(--mute)}
.who b{color:var(--ink)}
.timer{font-weight:800;font-size:1.3rem;background:var(--card);border:2px solid var(--pri);color:var(--pri);padding:6px 16px;border-radius:999px;font-variant-numeric:tabular-nums}
.timer.low{border-color:var(--bad);color:var(--bad)}
.grid{display:grid;grid-template-columns:1fr 280px;gap:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.qno{color:var(--pri);font-weight:800}
.qtext{font-size:1.1rem;margin:6px 0 16px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;margin-bottom:10px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--none);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.opt.sel{border-color:var(--pri);background:var(--card)}
.opt.sel .k{background:var(--pri);color:#fff}
.nav3{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.nav3 .btn{flex:1;min-width:110px}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.n{aspect-ratio:1;border:2px solid transparent;border-radius:10px;background:var(--none);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.n.a{background:var(--ok);color:#fff}
.n.d{background:var(--doubt);color:#2b1d00}
.n.cur{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri2)}
.legend{font-size:.8rem;color:var(--mute);display:grid;gap:4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.score{text-align:center;padding:24px}
.big{font-size:4rem;font-weight:800;line-height:1;color:var(--pri)}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:16px 0;text-align:left}
.info div{background:var(--bg);border-radius:12px;padding:10px 14px;font-size:.9rem}
.info b{display:block;font-size:.75rem;color:var(--mute);font-weight:600}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.pill{padding:4px 14px;border-radius:999px;font-weight:700;font-size:.85rem}
.rv{margin-top:14px;border-left:6px solid var(--none)}
.rv.right{border-left-color:var(--ok)}
.rv.wrong{border-left-color:var(--bad)}
.rv.skip{border-left-color:var(--doubt)}
.ans{padding:8px 12px;border-radius:10px;margin:6px 0;font-size:.92rem}
.ans.g{background:var(--okbg)}
.ans.r{background:var(--badbg)}
.exp{background:var(--bg);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:.92rem}
.modal{position:fixed;inset:0;background:rgba(10,10,40,.6);display:grid;place-items:center;padding:16px;z-index:20}
.modal .card{max-width:380px}
</style>
</head>
<body>
<div class="wrap">

<section id="start">
  <div class="hero"><h1>Try Out TKA</h1><p>Tes Kemampuan Akademik – latihan soal dengan timer dan pembahasan.</p></div>
  <div class="card">
    <h2 style="margin:0">Isi data peserta</h2>
    <label for="f-nama">Nama siswa</label><input id="f-nama" autocomplete="name" placeholder="Nama lengkap">
    <label for="f-kelas">Kelas</label><input id="f-kelas" placeholder="Contoh: XII IPA 1">
    <label for="f-peserta">Peserta didik (NISN / nomor peserta)</label><input id="f-peserta" placeholder="Nomor peserta">
    <label for="f-sekolah">Asal sekolah</label><input id="f-sekolah" placeholder="Nama sekolah">
    <p id="err" class="who" style="color:var(--bad);margin:10px 0 0"></p>
    <p class="who" id="meta"></p>
    <button class="btn full" id="go">Mulai Try Out</button>
  </div>
</section>

<section id="quiz" class="hidden">
  <div class="top">
    <div class="who" id="who"></div>
    <div class="timer" id="timer" role="timer">00:00</div>
  </div>
  <div class="grid">
    <div class="card">
      <div><span class="qno" id="qno"></span> <span class="who" id="qmapel"></span></div>
      <p class="qtext" id="qtext"></p>
      <div id="opts"></div>
      <div class="nav3">
        <button class="btn alt" id="prev">‹ Sebelumnya</button>
        <button class="btn doubt" id="doubt">Ragu-ragu</button>
        <button class="btn" id="next">Selanjutnya ›</button>
      </div>
    </div>
    <aside class="card">
      <b>Navigasi soal</b>
      <div class="nums" id="nums"></div>
      <div class="legend">
        <span><i style="background:var(--ok)"></i>Sudah dijawab</span>
        <span><i style="background:var(--doubt)"></i>Ragu-ragu</span>
        <span><i style="background:var(--none)"></i>Belum dijawab</span>
      </div>
      <button class="btn ok full" id="finish">Selesai</button>
    </aside>
  </div>
</section>

<section id="result" class="hidden">
  <div class="hero"><h1>Hasil Try Out TKA</h1><p>Terima kasih sudah mengerjakan. Pelajari pembahasan di bawah.</p></div>
  <div class="card score">
    <div class="who">Nilai akhir</div>
    <div class="big" id="nilai">0</div>
    <div class="stats" id="stats"></div>
    <div class="info" id="info"></div>
    <button class="btn" id="again">Ulangi Try Out</button>
  </div>
  <h2 style="margin:22px 0 0">Pembahasan soal</h2>
  <div id="review"></div>
</section>

</div>
<div id="modal" class="modal hidden"><div class="card"><h3 style="margin-top:0">Selesaikan try out?</h3><p id="mtext"></p>
<div class="nav3"><button class="btn alt" id="mno">Kembali</button><button class="btn ok" id="myes">Ya, selesai</button></div></div></div>

<script>
// ====== EDIT BAGIAN INI: durasi (menit) dan bank soal ======
var DURASI = 30;
var SOAL = [
 {m:"Matematika",q:"Jika 2x + 5 = 17, maka nilai x adalah …",o:["4","5","6","7","8"],a:2,e:"2x + 5 = 17 → 2x = 12 → x = 6."},
 {m:"Matematika",q:"Luas lingkaran dengan jari-jari 7 cm (π = 22/7) adalah …",o:["44 cm²","154 cm²","308 cm²","49 cm²","22 cm²"],a:1,e:"L = π × r² = 22/7 × 7 × 7 = 154 cm²."},
 {m:"Matematika",q:"Median dari data 4, 7, 5, 9, 6, 8, 10 adalah …",o:["6","7","8","9","5"],a:1,e:"Urutkan: 4, 5, 6, 7, 8, 9, 10. Data ke-4 dari 7 data adalah 7."},
 {m:"Matematika",q:"Hasil dari 3⁴ ÷ 3² adalah …",o:["3","6","9","27","81"],a:2,e:"Pada pembagian bilangan berpangkat, pangkat dikurangi: 3⁴⁻² = 3² = 9."},
 {m:"Bahasa Indonesia",q:"Kalimat yang menggunakan huruf kapital dengan benar adalah …",o:["Dia berasal dari jawa tengah.","Kami berlibur ke Pulau Bali.","Ibu membeli Baju baru.","Adik pergi ke Sekolah.","Saya bertemu Dengan paman."],a:1,e:"Nama geografi diawali huruf kapital: Pulau Bali. Pilihan lain salah pada kata “jawa tengah”, “Baju”, “Sekolah”, dan “Dengan”."},
 {m:"Bahasa Indonesia",q:"Gagasan utama paragraf biasanya terdapat pada …",o:["kalimat penjelas","kalimat utama","judul bacaan","kalimat terakhir saja","kata penghubung"],a:1,e:"Gagasan utama dinyatakan dalam kalimat utama, sedangkan kalimat penjelas mengembangkannya."},
 {m:"Bahasa Indonesia",q:"Antonim kata “rajin” adalah …",o:["tekun","giat","malas","ulet","cekatan"],a:2,e:"Lawan kata rajin adalah malas."},
 {m:"Bahasa Inggris",q:"She ___ to school every day.",o:["go","goes","going","gone","went"],a:1,e:"Simple present dengan subjek orang ketiga tunggal (she) memakai verb + s/es: goes."},
 {m:"Bahasa Inggris",q:"The opposite of “expensive” is …",o:["cheap","heavy","large","quick","narrow"],a:0,e:"Expensive (mahal) berlawanan dengan cheap (murah)."},
 {m:"IPA",q:"Proses tumbuhan membuat makanan dengan bantuan cahaya matahari disebut …",o:["respirasi","fermentasi","fotosintesis","transpirasi","evaporasi"],a:2,e:"Fotosintesis mengubah CO₂ dan air menjadi glukosa dan oksigen dengan bantuan cahaya."}
];
// ===========================================================

var $=function(i){return document.getElementById(i)};
var S={};
function show(id){["start","quiz","result"].forEach(function(s){$(s).classList.toggle("hidden",s!==id)});window.scrollTo(0,0)}
function pad(n){return (n<10?"0":"")+n}
$("meta").textContent=SOAL.length+" soal · waktu "+DURASI+" menit";

$("go").onclick=function(){
  var d={nama:$("f-nama").value.trim(),kelas:$("f-kelas").value.trim(),peserta:$("f-peserta").value.trim(),sekolah:$("f-sekolah").value.trim()};
  if(!d.nama||!d.kelas||!d.peserta||!d.sekolah){$("err").textContent="Lengkapi semua data terlebih dahulu.";return}
  $("err").textContent="";
  S={d:d,i:0,ans:SOAL.map(function(){return -1}),dbt:SOAL.map(function(){return false}),left:DURASI*60};
  $("who").innerHTML="<b>"+esc(d.nama)+"</b> · "+esc(d.kelas)+" · "+esc(d.sekolah)+"<br>Peserta: "+esc(d.peserta);
  show("quiz");render();tick();
  S.t=setInterval(tick,1000);
};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function tick(){
  var m=Math.floor(S.left/60),s=S.left%60;
  $("timer").textContent=pad(m)+":"+pad(s);
  $("timer").classList.toggle("low",S.left<=300);
  if(S.left<=0){finish();return}
  S.left--;
}
function render(){
  var q=SOAL[S.i];
  $("qno").textContent="Soal "+(S.i+1)+" dari "+SOAL.length;
  $("qmapel").textContent="· "+q.m;
  $("qtext").textContent=q.q;
  $("opts").innerHTML="";
  q.o.forEach(function(t,k){
    var b=document.createElement("button");
    b.className="opt"+(S.ans[S.i]===k?" sel":"");
    b.innerHTML='<span class="k">'+"ABCDE"[k]+'</span><span>'+esc(t)+'</span>';
    b.onclick=function(){S.ans[S.i]=k;render()};
    $("opts").appendChild(b);
  });
  $("prev").disabled=S.i===0;
  $("next").disabled=S.i===SOAL.length-1;
  $("doubt").classList.toggle("on",S.dbt[S.i]);
  $("doubt").textContent=S.dbt[S.i]?"Batal ragu-ragu":"Ragu-ragu";
  $("nums").innerHTML="";
  SOAL.forEach(function(_,k){
    var b=document.createElement("button");
    b.className="n"+(S.dbt[k]?" d":S.ans[k]>=0?" a":"")+(k===S.i?" cur":"");
    b.textContent=k+1;b.setAttribute("aria-label","Soal "+(k+1));
    b.onclick=function(){S.i=k;render()};
    $("nums").appendChild(b);
  });
}
$("prev").onclick=function(){if(S.i>0){S.i--;render()}};
$("next").onclick=function(){if(S.i<SOAL.length-1){S.i++;render()}};
$("doubt").onclick=function(){S.dbt[S.i]=!S.dbt[S.i];render()};
$("finish").onclick=function(){
  var un=S.ans.filter(function(x){return x<0}).length,db=S.dbt.filter(Boolean).length;
  $("mtext").textContent="Belum dijawab: "+un+" soal. Ragu-ragu: "+db+" soal. Jawaban tidak dapat diubah setelah selesai.";
  $("modal").classList.remove("hidden");
};
$("mno").onclick=function(){$("modal").classList.add("hidden")};
$("myes").onclick=function(){$("modal").classList.add("hidden");finish()};

function finish(){
  clearInterval(S.t);
  var ok=0,bad=0,skip=0;
  S.ans.forEach(function(a,k){if(a<0)skip++;else if(a===SOAL[k].a)ok++;else bad++});
  var nilai=Math.round(ok/SOAL.length*100);
  $("nilai").textContent=nilai;
  $("stats").innerHTML='<span class="pill" style="background:var(--okbg);color:var(--ok)">Benar '+ok+'</span><span class="pill" style="background:var(--badbg);color:var(--bad)">Salah '+bad+'</span><span class="pill" style="background:var(--none)">Kosong '+skip+'</span>';
  var d=S.d;
  $("info").innerHTML=[["Nama",d.nama],["Kelas",d.kelas],["Peserta didik",d.peserta],["Asal sekolah",d.sekolah]].map(function(r){return "<div><b>"+r[0]+"</b>"+esc(r[1])+"</div>"}).join("");
  $("review").innerHTML=SOAL.map(function(q,k){
    var a=S.ans[k],st=a<0?"skip":a===q.a?"right":"wrong";
    var lbl=a<0?"Tidak dijawab":a===q.a?"Benar":"Salah";
    return '<div class="card rv '+st+'"><b class="qno">Soal '+(k+1)+'</b> <span class="who">· '+q.m+' · '+lbl+'</span>'
      +'<p class="qtext">'+esc(q.q)+'</p>'
      +(a>=0&&a!==q.a?'<div class="ans r">Jawaban Anda: '+"ABCDE"[a]+'. '+esc(q.o[a])+'</div>':'')
      +'<div class="ans g">Jawaban benar: '+"ABCDE"[q.a]+'. '+esc(q.o[q.a])+'</div>'
      +'<div class="exp"><b>Pembahasan:</b> '+esc(q.e)+'</div></div>';
  }).join("");
  show("result");
}
$("again").onclick=function(){show("start")};
</script>
</body>
</html>
